<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Atlas · LLyA: globo terraqueo con los colores del isotipo (azules de las "L" y verde azulado de la "A") -->
  <defs>
    <linearGradient id="mar" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#63C6F2"/>
      <stop offset="0.55" stop-color="#29A9D6"/>
      <stop offset="1" stop-color="#1A7FB0"/>
    </linearGradient>
    <linearGradient id="orbita" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12B5B8"/>
      <stop offset="1" stop-color="#0A4F5C"/>
    </linearGradient>
    <clipPath id="esfera"><circle cx="32" cy="32" r="24"/></clipPath>
  </defs>
  <!-- orbita, mitad de atras -->
  <ellipse cx="32" cy="32" rx="30" ry="10" fill="none" stroke="url(#orbita)" stroke-width="4" transform="rotate(-24 32 32)" opacity="0.55"/>
  <circle cx="32" cy="32" r="24" fill="url(#mar)"/>
  <g clip-path="url(#esfera)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.4">
    <!-- paralelos -->
    <line x1="6" y1="32" x2="58" y2="32"/>
    <path d="M10 20 Q32 25 54 20"/>
    <path d="M10 44 Q32 39 54 44"/>
    <!-- meridianos -->
    <ellipse cx="32" cy="32" rx="10" ry="24"/>
    <line x1="32" y1="8" x2="32" y2="56"/>
  </g>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#1A7FB0" stroke-width="1.5"/>
  <!-- orbita, mitad de adelante (cruza por delante del globo) -->
  <path d="M2 32 A30 10 0 0 0 62 32" fill="none" stroke="url(#orbita)" stroke-width="4" stroke-linecap="round" transform="rotate(-24 32 32)"/>
</svg>
