# ============================================================================
# Maestro Platform — docker-compose.prod.yml
# ============================================================================
# Deploy en VPS (gestionado por el humano fuera del framework agentico — DEC-011).
# Prerequisitos en VPS: Docker + Docker Compose + dominio DNS apuntando al host.
# Secretos: Docker Secrets o un gestor externo; NO commitear .env al VPS.
#
# Diferencias vs docker-compose.dev.yml:
#   - Imágenes pre-buildadas desde GHCR (no build local)
#   - Target: prod (php-fpm+nginx optimizado, sin xdebug, nginx:alpine static portal)
#   - Sin bind mounts del código (inmutable)
#   - Traefik con Let's Encrypt ACME (cert-manager)
#   - docker-socket-proxy con policy estricta (mirror dev pero sin EXEC/BUILD)
#   - Recursos acotados (CPU/Memory) + PidsLimit
#   - Readonly rootfs donde aplica
#   - Restart policy: always
#
# Levantar:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ============================================================================

name: maestro

networks:
  maestro-network:
    name: maestro-network
    driver: bridge

volumes:
  maestro-db-data:
  maestro-redis-data:
  maestro-traefik-acme:
  maestro-api-storage:
  maestro-secrets:

services:
  maestro-traefik:
    image: traefik:v3.5
    container_name: maestro-traefik
    restart: always
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.prod.yml:/etc/traefik/dynamic.yml:ro
      - maestro-traefik-acme:/acme
    networks:
      - maestro-network
    depends_on:
      - maestro-docker-proxy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  maestro-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: maestro-docker-proxy
    restart: always
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      EXEC: 0
      INFO: 1
      VERSION: 1
      PING: 1
      IMAGES: 1
      POST: 1
      EVENTS: 1
      DISTRIBUTION: 1
      BUILD: 0
      COMMIT: 0
      VOLUMES: 0
      PLUGINS: 0
      SYSTEM: 0
      SWARM: 0
      SECRETS: 0
      NODES: 0
      SESSION: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - maestro-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    pids_limit: 100

  maestro-db:
    image: postgres:16-alpine
    container_name: maestro-db
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    volumes:
      - maestro-db-data:/var/lib/postgresql/data
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 200
    labels:
      - "traefik.enable=false"

  maestro-redis:
    image: redis:7-alpine
    container_name: maestro-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - maestro-redis-data:/data
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    labels:
      - "traefik.enable=false"

  maestro-api:
    image: ghcr.io/llyasoc-digital/web-maestro-para-aplicacones-genericas-api:${IMAGE_TAG:-latest}
    container_name: maestro-api
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      LOG_CHANNEL: "stderr"
    volumes:
      - maestro-api-storage:/app/storage
      - maestro-secrets:/secrets:ro
    networks:
      - maestro-network
    depends_on:
      maestro-db:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
      maestro-docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/platform/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=maestro-network"
      - "traefik.http.routers.maestro-api.rule=Host(`maestro.${MAESTRO_BASE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.maestro-api.entrypoints=websecure"
      - "traefik.http.routers.maestro-api.tls=true"
      - "traefik.http.routers.maestro-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.maestro-api.loadbalancer.server.port=8080"
      - "traefik.http.services.maestro-api.loadbalancer.healthcheck.path=/api/platform/health"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
      - /var/log/supervisor
    pids_limit: 512

  maestro-worker:
    image: ghcr.io/llyasoc-digital/web-maestro-para-aplicacones-genericas-api:${IMAGE_TAG:-latest}
    container_name: maestro-worker
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      CONTAINER_ROLE: "worker"
    volumes:
      - maestro-api-storage:/app/storage
      - maestro-secrets:/secrets:ro
    working_dir: /app
    command: ["php", "artisan", "queue:work", "--tries=5", "--backoff=1,5,30,120,600", "--timeout=120"]
    networks:
      - maestro-network
    depends_on:
      maestro-db:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor default --max=1000 || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 512
    labels:
      - "traefik.enable=false"

  maestro-scheduler:
    image: ghcr.io/llyasoc-digital/web-maestro-para-aplicacones-genericas-api:${IMAGE_TAG:-latest}
    container_name: maestro-scheduler
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: "production"
      APP_DEBUG: "false"
      CONTAINER_ROLE: "scheduler"
    volumes:
      - maestro-api-storage:/app/storage
      - maestro-secrets:/secrets:ro
    working_dir: /app
    command: ["php", "artisan", "schedule:work"]
    networks:
      - maestro-network
    depends_on:
      maestro-db:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    labels:
      - "traefik.enable=false"

  maestro-portal:
    image: ghcr.io/llyasoc-digital/web-maestro-para-aplicacones-genericas-portal:${IMAGE_TAG:-latest}
    container_name: maestro-portal
    restart: always
    networks:
      - maestro-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=maestro-network"
      - "traefik.http.routers.maestro-portal.rule=Host(`maestro.${MAESTRO_BASE_DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.maestro-portal.entrypoints=websecure"
      - "traefik.http.routers.maestro-portal.tls=true"
      - "traefik.http.routers.maestro-portal.tls.certresolver=letsencrypt"
      - "traefik.http.services.maestro-portal.loadbalancer.server.port=8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    pids_limit: 200
