# ============================================================================
# Maestro Platform — docker-compose.dev.yml
# ============================================================================
# Desarrollo local 100% dockerizado (DEC-012).
# Único prerequisito host: Docker + Docker Compose + git + IDE.
# Levantar: `docker compose up -d`  (o `just up`)
# Toolchain: `docker compose run --rm <servicio> <comando>`
# ============================================================================

name: maestro

networks:
  maestro-network:
    name: maestro-network
    driver: bridge

volumes:
  maestro-db-data:
  maestro-redis-data:
  maestro-traefik-acme:
  maestro-portal-node-modules:
  maestro-azurite-data:

services:
  # ----------------------------------------------------------------------
  # Traefik v3 — reverse proxy + ForwardAuth + TLS (self-signed en dev)
  # ----------------------------------------------------------------------
  maestro-traefik:
    image: traefik:v3.5
    container_name: maestro-traefik
    restart: unless-stopped
    environment:
      # Docker Desktop 29.4.0 tiene mínimo API 1.40; Traefik por defecto negocia 1.24.
      DOCKER_API_VERSION: "1.40"
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - maestro-traefik-acme:/acme
      # DEV: socket directo (ver nota en traefik.yml). PROD usa docker-socket-proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - maestro-network
    depends_on:
      - maestro-docker-proxy
    labels:
      - "traefik.enable=false"
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # ----------------------------------------------------------------------
  # Docker socket proxy — acceso restringido a Docker API (ADR-006)
  # ----------------------------------------------------------------------
  maestro-docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: maestro-docker-proxy
    restart: unless-stopped
    environment:
      # Allowlist (ver ADR-006 para detalle)
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1           # necesario para Traefik discovery
      TASKS: 1
      EXEC: 0               # dev: desactivado
      INFO: 1
      VERSION: 1
      PING: 1
      IMAGES: 1             # necesario para pull de imágenes
      POST: 1               # habilita POSTs permitidos (networks/create, containers/create, etc.)
      EVENTS: 1             # Traefik necesita /events para discovery en tiempo real
      DISTRIBUTION: 1       # necesario para image pulls autenticados
      # Bloqueados
      BUILD: 0
      COMMIT: 0
      VOLUMES: 0
      PLUGINS: 0
      SYSTEM: 0
      SWARM: 0
      SECRETS: 0
      NODES: 0
      SESSION: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - maestro-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

  # ----------------------------------------------------------------------
  # PostgreSQL 16 — BD del Maestro
  # ----------------------------------------------------------------------
  maestro-db:
    image: postgres:16-alpine
    container_name: maestro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-maestro}"
      POSTGRES_USER: "${DB_USERNAME:-maestro}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"
    volumes:
      - maestro-db-data:/var/lib/postgresql/data
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-maestro} -d ${DB_DATABASE:-maestro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Redis 7 — cache + queue + rate limiting
  # ----------------------------------------------------------------------
  maestro-redis:
    image: redis:7-alpine
    container_name: maestro-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-changeme}"
    volumes:
      - maestro-redis-data:/data
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Maestro API — Laravel 13 backend (php-fpm + nginx sidecar)
  # ----------------------------------------------------------------------
  maestro-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: maestro-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # DEV: exposición directa para acceso desde browser local.
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro    # bind mount para oauth-*.key en dev
    working_dir: /app
    networks:
      - maestro-network
    depends_on:
      maestro-db:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/platform/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=maestro-network"
      - "traefik.http.routers.maestro-api.rule=Host(`maestro.${MAESTRO_BASE_DOMAIN:-maestro.local}`)"
      - "traefik.http.routers.maestro-api.entrypoints=websecure"
      - "traefik.http.routers.maestro-api.tls=true"
      - "traefik.http.services.maestro-api.loadbalancer.server.port=8080"
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Maestro Worker — Laravel queue workers (health checks, provisioning, hooks)
  # ----------------------------------------------------------------------
  maestro-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: maestro-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro
    working_dir: /app
    command: ["php", "artisan", "queue:work", "--tries=5", "--backoff=1,5,30,120,600"]
    networks:
      - maestro-network
    depends_on:
      maestro-db:
        condition: service_healthy
      maestro-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Portal React — dev server Vite con HMR
  # ----------------------------------------------------------------------
  maestro-portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
      target: dev
    container_name: maestro-portal
    restart: unless-stopped
    ports:
      # DEV: exposición directa para verificación (Traefik v3.5 no es compatible con Docker API 1.54).
      # PROD: se quitará y se usará solo Traefik (ver preset maestro-platform).
      - "8081:8081"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api}"
      VITE_APP_TITLE: "${VITE_APP_TITLE:-Maestro}"
      VITE_MICROSOFT_ENTRA_ENABLED: "${VITE_MICROSOFT_ENTRA_ENABLED:-false}"
    volumes:
      - ./portal:/app
      - maestro-portal-node-modules:/app/node_modules
    working_dir: /app
    user: root
    entrypoint: ["/sbin/tini", "--"]
    command:
      - "sh"
      - "-c"
      - "chown -R app:app /app/node_modules && if [ ! -d node_modules/vite ]; then su app -c 'npm install'; fi && su app -c 'npm run dev -- --host 0.0.0.0 --port 8081'"
    networks:
      - maestro-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=maestro-network"
      - "traefik.http.routers.maestro-portal.rule=Host(`${MAESTRO_BASE_DOMAIN:-maestro.local}`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.maestro-portal.entrypoints=websecure"
      - "traefik.http.routers.maestro-portal.tls=true"
      - "traefik.http.services.maestro-portal.loadbalancer.server.port=8081"
    security_opt:
      - no-new-privileges:true

  # ----------------------------------------------------------------------
  # Azurite — emulador de Azure Blob Storage para dev (DEC-027)
  # ----------------------------------------------------------------------
  # Reemplaza la cuenta Azure real en desarrollo. BackupService apunta a
  # AZURE_STORAGE_ENDPOINT=http://azurite:10000/devstoreaccount1.
  # Credenciales dummy estándar de Azurite (ver .env).
  # ----------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: maestro-azurite
    restart: unless-stopped
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    volumes:
      - maestro-azurite-data:/data
    networks:
      - maestro-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
