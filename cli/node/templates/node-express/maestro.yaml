apiVersion: maestro.platform/v2
kind: Application
metadata:
  name: {{APP_NAME}}
  version: {{APP_VERSION}}
  description: App huesped generada con maestro-cli (framework v4 / contrato v2).
requires:
  database: postgres
  ports:
    app: 3000
health:
  endpoint: /health
  timeout_seconds: 5
auth:
  mode: own                          # v2: la app implementa su propio login
  login_path: /login
  logout_path: /logout               # opcional
branding:
  url: /maestro/branding             # endpoint autenticado con X-Maestro-Api-Key
seeding:
  superadmin_email: admin@llyasoc.com
  additional_users: []               # opcional, decision del PO en fase 02-planning
hooks:                               # opcional
  on_user_added: /hooks/user-added
  on_user_removed: /hooks/user-removed
resources:
  memory: 512m
  cpu: 0.5
ui:
  tailwise: true
  theme: echo
env:                                 # custom env vars de la app (no MAESTRO_*, no SUPERADMIN_*, no DATABASE_URL)
  - LOG_LEVEL
