apiVersion: maestro.platform/v1
kind: Application
metadata:
  name: {{APP_NAME}}
  version: {{APP_VERSION}}
  description: App huésped generada con maestro-cli.
requires:
  database: postgres
  ports:
    app: 3000
health:
  endpoint: /health
  timeout_seconds: 5
auth:
  mode: header
  headers:
    - X-Auth-User-Id
    - X-Auth-User-Email
    - X-Auth-Company-Id
    - X-Auth-Roles
    - X-Auth-Permissions
resources:
  memory: 512m
  cpu: 0.5
hooks:
  on_user_added: /hooks/user-added
  on_user_removed: /hooks/user-removed
