# deploy.yml — build, escaneo y publicacion de la imagen (SPEC §6.1, 08-CICD "Pipeline CI de las apps").
# Solo en master (despues del merge que hace el evaluador humano) o en tags vX.Y.Z.
# El registro en el Maestro (POST /api/v2/apps/register) NO esta aca: lo hace el evaluador humano (AGENTS.md §3).
name: deploy

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version de maestro.yaml
        id: ver
        run: |
          echo "version=$(grep -m1 -E '^  version:' maestro.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # docker exige minusculas
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (sin publicar) para escanear
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inventario:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamano de imagen (IN-004, <= 500 MB)
        run: |
          mb=$(( $(docker image inspect inventario:ci --format '{{.Size}}') / 1024 / 1024 ))
          echo "imagen: ${mb} MB"; [ "$mb" -le 500 ] || { echo "::error::imagen de ${mb} MB (> 500)"; exit 1; }
          [ "$mb" -le 350 ] || echo "::warning::imagen de ${mb} MB (> 350)"
      - name: Trivy CRITICAL/HIGH (IN-006 / CI-003)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: inventario:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
      - name: Publicar en ghcr
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ver.outputs.imagen }}:${{ github.sha }}
            ${{ steps.ver.outputs.imagen }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Firmar imagen (keyless)
        run: cosign sign --yes "${{ steps.ver.outputs.imagen }}@${{ steps.push.outputs.digest }}"
