name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-lint:
    name: Backend (lint + static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint (code style)
        working-directory: backend
        run: composer lint
      - name: PHPStan (larastan)
        working-directory: backend
        run: composer analyze

  backend-tests:
    name: Backend tests (PHPUnit/Pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maestro_test
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2
      - name: Composer install
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: maestro_test
          DB_USERNAME: maestro
          DB_PASSWORD: changeme
        run: php artisan migrate --force
      - name: Test suite
        working-directory: backend
        env:
          DB_HOST: localhost
          REDIS_HOST: localhost
          REDIS_PASSWORD: ''
        run: composer test-coverage

  portal-build:
    name: Portal (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install deps
        working-directory: portal
        run: npm ci
      - name: Typecheck + build
        working-directory: portal
        run: npm run build

  docker-scan:
    name: Docker image security scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/php/Dockerfile --target prod -t maestro-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: maestro-api:ci
          format: 'table'
          exit-code: '1'               # bloqueante (RNF-019)
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
