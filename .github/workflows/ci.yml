# ci.yml — validacion en cada push y PR (README §2 / §17, SPEC §7, MANUAL §7 Paso 3).
# GitHub Actions NO es fuente de verdad del Gate 1 (MANUAL §7): el evaluador lo re-corre localmente.
name: ci

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # ── Backend ──
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: app/backend/requirements-dev.txt }
      - name: Dependencias del backend
        run: pip install -r app/backend/requirements-dev.txt
      - name: Tests del backend (pytest)
        run: python -m pytest app/tests -q -p no:cacheprovider

      # ── Frontend ──
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - name: Dependencias del frontend
        working-directory: app/frontend
        run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        working-directory: app/frontend
        run: npx eslint .
      - name: Build del frontend
        working-directory: app/frontend
        run: npx vite build --outDir "$RUNNER_TEMP/dist"

      # ── Contrato ──
      # maestro-cli v2 todavia no esta publicado: se valida contra el JSON Schema v2 del template
      # (es el paso 1 de maestro-cli validate, SPEC §7).
      - name: Validar maestro.yaml contra el schema v2
        run: |
          pip install "jsonschema[format-nongpl]==4.26.0" pyyaml==6.0.3
          python - <<'EOF'
          import json, sys, yaml, jsonschema
          schema = json.load(open("docs/schemas/maestro.yaml.schema.v2.json", encoding="utf-8"))
          doc = yaml.safe_load(open("maestro.yaml", encoding="utf-8"))
          errs = list(jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).iter_errors(doc))
          for e in errs: print("::error file=maestro.yaml::%s: %s" % ("/".join(map(str, e.path)) or "(raiz)", e.message))
          expose = [l.split()[1] for l in open("Dockerfile") if l.startswith("EXPOSE")]
          if [str(doc["requires"]["ports"]["app"])] != expose:
              errs.append(1); print("::error file=Dockerfile::EXPOSE %s no coincide con requires.ports.app" % expose)
          sys.exit(1 if errs else 0)
          EOF
      - name: Compose (IN-011) — parsean y sin secretos hardcodeados
        run: |
          cp .env.example .env
          sed -i -e 's/^APP_PORT=.*/APP_PORT=3100/' -e 's/^DB_PASSWORD=$/DB_PASSWORD=ci/' .env
          fallo=0
          for f in docker-compose.yml docker-compose.test.yml docker-compose.preprod.yml; do
            docker compose -f "$f" --env-file .env config > /dev/null || fallo=1
            if grep -nE 'MAESTRO_API_KEY|_SECRET|_PASSWORD|SUPERADMIN' "$f" | grep -v '\${'; then
              echo "::error file=$f::secreto hardcodeado"; fallo=1
            fi
          done
          rm -f .env
          exit $fallo

      # ── Secretos (SE-001 / CI-004) ──
      # Bloqueante: commits propios de la app (todo lo que no viene del historial del template).
      - name: Gitleaks — commits de la app
        run: |
          tpl=$(git log --format=%H --merges --grep="integra la app sobre el template" -1)
          rango="--all"; [ -n "$tpl" ] && rango="$(git rev-parse "$tpl^2")..HEAD"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact \
            --log-opts="$rango" --exit-code 1
      # Informativo: historial completo, incluido el heredado del template (MANUAL §7 pide todo el
      # historial; los hallazgos del template quedan a decision del evaluador humano).
      - name: Gitleaks — historial completo (informativo)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact \
            --log-opts=--all --exit-code 1
