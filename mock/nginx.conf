# ============================================================
# MAESTRO MOCK — Simulador de autenticación
# ============================================================
# Este nginx actúa como proxy inverso que simula lo que
# Traefik + Maestro hacen en producción:
#   1. Intercepta el request del navegador
#   2. Agrega headers X-Auth-* con la identidad del usuario
#   3. Reenvia el request a tu app
#
# En desarrollo, accedé a tu app vía http://localhost:{MOCK_PORT}
# para que los headers de autenticación estén presentes.
#
# Los valores de los headers se configuran en las variables
# MOCK_* del archivo .env (ver .env.example).
# ============================================================

server {
    listen 80;
    server_name localhost;

    # ── Timeout generoso para desarrollo (debug, breakpoints) ──
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── Health check del mock (no proxea, responde directo) ──
    location /mock/health {
        return 200 '{"status":"ok","service":"maestro-mock"}';
        add_header Content-Type application/json;
    }

    # ── Todo lo demás se proxea a la app con headers de auth ──
    location / {
        # Inyectar headers de identidad (simula Traefik ForwardAuth)
        proxy_set_header X-Auth-User-Id          "1";
        proxy_set_header X-Auth-User-Email       "dev@empresa-test.com";
        proxy_set_header X-Auth-Company-Id       "1";
        proxy_set_header X-Auth-Roles            "admin";
        proxy_set_header X-Auth-Permissions      '["read","write","delete","admin"]';

        # Headers estándar de proxy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxear a la app (usa el nombre del servicio Docker)
        # IMPORTANTE: cambiar el puerto si tu app usa uno diferente a 3000
        proxy_pass http://app:3000;

        # Soporte WebSocket (si tu app lo necesita)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
