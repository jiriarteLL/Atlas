[www]
user = app
group = app
listen = 127.0.0.1:9000
listen.owner = app
listen.group = app
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Log a stdout para que supervisord/Docker lo recolecte
access.log = /dev/null
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
clear_env = no
