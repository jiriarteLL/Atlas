# Traefik dynamic configuration
# Define middlewares reusables: ForwardAuth, security headers, rate limits

http:
  middlewares:
    # ForwardAuth hacia el Maestro (ADR-004 + no-negociable 1)
    # Aplica a rutas protegidas de apps huésped (se agrega via labels Docker)
    forward-auth-maestro:
      forwardAuth:
        address: "http://maestro-api:8080/api/auth/validate"
        trustForwardHeader: false
        authResponseHeaders:
          - "X-Auth-User-Id"
          - "X-Auth-User-Email"
          - "X-Auth-Company-Id"
          - "X-Auth-Roles"
          - "X-Auth-Permissions"

    # Security headers globales (RNF-011, RNF-044)
    security-headers:
      headers:
        frameDeny: false                         # CSP frame-ancestors hace el trabajo fino
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "geolocation=(), microphone=(), camera=()"
        stsSeconds: 31536000                      # HSTS 1 año
        stsIncludeSubdomains: true
        stsPreload: true
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:;
          font-src 'self' data:;
          connect-src 'self' https:;
          frame-src 'self';
          frame-ancestors 'self';
          base-uri 'self';
          form-action 'self';
          upgrade-insecure-requests

    # Rate limit por defecto: 100 req/min/IP (RF-043)
    rate-limit-default:
      rateLimit:
        average: 100
        period: 1m
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Rate limit estricto para login (RF-043, 10 req/min/IP)
    rate-limit-login:
      rateLimit:
        average: 10
        period: 1m
        burst: 5
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Rate limit para /api/v1/apps/register (100 req/min/token)
    rate-limit-apps-register:
      rateLimit:
        average: 100
        period: 1m
        burst: 20

    # Chain para rutas protegidas de apps huésped
    app-huesped-chain:
      chain:
        middlewares:
          - forward-auth-maestro
          - security-headers
          - rate-limit-default

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      sniStrict: true
