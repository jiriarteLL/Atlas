global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'maestro-platform'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['obs-cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['obs-node-exporter:9100']

  # Métricas del Maestro API — expone /metrics si se agrega laravel-prom-exporter
  - job_name: 'maestro-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['maestro-api:8080']

  # Traefik metrics endpoint
  - job_name: 'traefik'
    static_configs:
      - targets: ['maestro-traefik:8082']

# Alert rules — cargadas desde el directorio montado en obs-prometheus
rule_files:
  - /etc/prometheus/alerts/*.yml
