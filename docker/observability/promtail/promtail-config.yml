server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://obs-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["maestro.managed=true"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_maestro_instance_id']
        target_label: 'instance_id'
      - source_labels: ['__meta_docker_container_label_maestro_role']
        target_label: 'role'
      - source_labels: ['__meta_docker_container_label_maestro_managed']
        target_label: 'managed'
    pipeline_stages:
      - json:
          expressions:
            level: level
            request_id: request_id
            company_id: company_id
            user_id: user_id
      - labels:
          level:
          company_id:   # útil para filtrar logs por tenant (RF-102)
